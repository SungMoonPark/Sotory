user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=5r/s;
    # ✅ 언더스코어 헤더 허용 설정 추가
    underscores_in_headers on;

    log_format rate_limit_log '[$time_local] $remote_addr exceeded limit - "$request"';
    map $status $limit_log {
        429 1;
        default 0;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/rate_limited.log rate_limit_log if=$limit_log;

    server {
        listen 80;
        server_name p.ssafy.io;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name p.ssafy.io;

        ssl_certificate     /etc/letsencrypt/live/p.ssafy.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/p.ssafy.io/privkey.pem;

        # 🔹 SpringBoot API 요청
        location / {
            limit_req zone=req_limit_per_ip burst=200 nodelay;

            proxy_pass http://springboot:8080/api/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # 🔹 Swagger UI (정적 HTML/JS)
        location /swagger-ui/ {
            proxy_pass http://springboot:8080/swagger-ui/;
        }

        # 🔹 OpenAPI 문서 JSON
        location /v3/api-docs/ {
            proxy_pass http://springboot:8080/v3/api-docs/;
        }

        # 🔹 FastAPI 요청 - 예: /pyapi/xxx 로 시작하는 모든 요청
        location /pyapi/ {
            limit_req zone=req_limit_per_ip burst=200 nodelay;

            proxy_pass http://fastapi:8000/;  # ⚠️ 실제 Docker 서비스명 및 포트 확인
            rewrite ^/pyapi/(.*)$ /$1 break;  # prefix 제거

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        location = /openapi.json {
            proxy_pass http://fastapi:8000/openapi.json;
        }
    }
}